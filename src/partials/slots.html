        <span class="material-symbols-outlined campana-icon">rocket</span>

          <strong>Campaña 1</strong>

        </div>

    <div class="campana" data-slot="2">

          <strong>Campaña 2</strong>

      <button class="btn-borrar" title="Borrar partida" aria-label="Borrar campaña 2">
        <span class="material-symbols-outlined">delete</span>
      </button>

    <div class="campana" data-slot="3">

        </div>

      <button class="btn-borrar" title="Borrar partida" aria-label="Borrar campaña 3">
        <span class="material-symbols-outlined">delete</span>
      </button>
    </div>
  </div>

  <button id="btn-campanas-volver" class="btn-menu">
    <span class="material-symbols-outlined">arrow_back</span>
    Volver
  </button>
</div>
