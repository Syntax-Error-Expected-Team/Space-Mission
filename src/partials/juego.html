<div class="juego-container">
  <header class="juego-header">
    <div class="juego-identidad">
      <span class="material-symbols-outlined" aria-hidden="true"
        >rocket_launch</span
      >
      <div>
        <p>SPACE MISSION</p>
        <h1>Centro de mando</h1>
      </div>
    </div>

    <div class="juego-recursos" aria-label="Recursos de la misión">
      <div class="juego-recurso">
        <span class="material-symbols-outlined" aria-hidden="true"
          >savings</span
        >
        <div>
          <span>Presupuesto</span>
          <strong>$<span id="juego-presupuesto">0</span></strong>
          <small>+$<span id="juego-ingreso-presupuesto">250</span></small>
        </div>
      </div>
      <div class="juego-recurso">
        <span class="material-symbols-outlined" aria-hidden="true"
          >science</span
        >
        <div>
          <span>Puntos de investigación</span>
          <strong id="juego-ciencia">0</strong>
          <small>+<span id="juego-ingreso-ciencia">20</span> pts</small>
        </div>
      </div>
    </div>
  </header>

  <main class="juego-main" aria-live="polite">
    <section class="juego-panel" data-juego-panel="misionTree"></section>
    <section class="juego-panel" data-juego-panel="taller" hidden></section>
    <section
      class="juego-panel"
      data-juego-panel="investigacion"
      hidden
    ></section>
  </main>

  <aside class="juego-sidebar">
    <button
      type="button"
      id="btn-toggle-sidebar"
      class="btn-toggle-sidebar"
      aria-label="Colapsar barra lateral"
      aria-expanded="true"
    >
      <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
    </button>
    
    <div>
      <p class="juego-etiqueta">NAVEGACIÓN</p>
      <nav class="juego-nav" aria-label="Secciones del centro de mando">
        <button type="button" data-juego-vista="misionTree" aria-current="page">
          <span class="material-symbols-outlined" aria-hidden="true"
            >dashboard</span
          >
          Misiones
        </button>
        <button type="button" data-juego-vista="taller">
          <span class="material-symbols-outlined" aria-hidden="true"
            >build</span
          >
          Taller
        </button>
        <button type="button" data-juego-vista="investigacion">
          <span class="material-symbols-outlined" aria-hidden="true"
            >account_tree</span
          >
          Desarrollo
        </button>
      </nav>
      <div class="juego-sidebar-acciones">
        <button
          id="btn-informacion"
          class="btn-icono btn-sidebar"
          type="button"
          title="Información desbloqueada"
          aria-label="Información desbloqueada"
        >
          <span class="material-symbols-outlined" aria-hidden="true">auto_stories</span>
        </button>
        <button
          id="btn-misiones-volver"
          class="btn-icono btn-sidebar"
          type="button"
          title="Volver"
          aria-label="Volver"
        >
          <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
        </button>
      </div>
    </div>
  </aside>

  <footer class="juego-turno">
    <div class="juego-turno-info">
      <span>Mes actual</span>
      <strong id="juego-turno">1</strong>
    </div>
    <button id="btn-pasar-turno" type="button">
      Pasar Mes
      <span class="material-symbols-outlined" aria-hidden="true"
        >arrow_forward</span
      >
    </button>
  </footer>
</div>
