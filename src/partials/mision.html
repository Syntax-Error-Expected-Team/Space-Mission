<div class="mision-container">
  <header class="mision-header">
    <h2>Mapa de Misiones / Nodos</h2>
    <div class="recursos-hud" aria-label="Recursos e ingresos mensuales">
      <div class="recurso-item">
        <span class="material-symbols-outlined" aria-hidden="true"
          >savings</span
        >
        <span class="recurso-detalles">
          <span> $<span id="hud-presupuesto">1000</span> </span>
          <small>+$<span id="hud-ingreso-presupuesto">250</span></small>
        </span>
      </div>
      <div class="recurso-item">
        <span class="material-symbols-outlined" aria-hidden="true"
          >science</span
        >
        <span class="recurso-detalles">
          <span>
            <span id="hud-ciencia">0</span>
          </span>
          <small>+<span id="hud-ingreso-ciencia">20</span> pts</small>
        </span>
      </div>
    </div>
  </header>

  <div class="mapa-nodos-wrapper">
    <svg
      class="mapa-conexiones"
      viewBox="0 0 100 100"
      preserveAspectRatio="none"
      aria-hidden="true"
      focusable="false"
    >
      <g id="conexiones-nodos"></g>
    </svg>
    <div id="mapa-nodos"></div>
  </div>

  <footer class="mision-footer">
    <button
      id="btn-mision-volver"
      class="btn-icono volver-btn"
      title="Volver al menú"
      aria-label="Volver"
    >
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <p>Haz clic en un nodo disponible para iniciar la misión.</p>
  </footer>
</div>
